name: Run msaccess-vcs-build on all Access folders
description: This action runs the msaccess-vcs-build action on all Access folders found in the source directory.

inputs:

  source-dir-values:
    description: '|||-separated values to pass'
    required: true
  target-dir:
    description: 'Target directory for the build output'
    required: true
  access-vcs-compile:
    description: 'Force compiling all Access builds (true/false). Empty = auto-compile only folders named *.accde'
    required: false
    default: ""
  access-vcs-config:
    description: 'Application config file (set database properties, run procedures, remove modules/references, etc.)'
    required: false
    default: ""
  access-vcs-url:
    description: 'VCS URL for the Access database add-in'
    required: false
    default: "https://api.github.com/repos/joyfullservice/msaccess-vcs-addin/releases/tags/v5.0.1"
  access-vcs-sha:
    description: 'Expected SHA256 digest of the VCS asset (optional - if not provided, verification is skipped)'
    required: false

runs:
  using: "composite"
  steps:
    - id: parse
      shell: bash
      run: |
        IFS='|||' read -ra VALS <<< "${{ inputs.source-dir-values }}"
        for i in "${!VALS[@]}"; do
          echo "value$i=${VALS[$i]}" >> $GITHUB_OUTPUT
          if [[ -n "${{ inputs.access-vcs-compile }}" ]]; then
            echo "compile$i=${{ inputs.access-vcs-compile }}" >> $GITHUB_OUTPUT
          elif [[ "${VALS[$i]}" =~ \.accde(\.src)?$ ]]; then
            echo "compile$i=true" >> $GITHUB_OUTPUT
          else
            echo "compile$i=false" >> $GITHUB_OUTPUT
          fi
        done
        echo "count=${#VALS[@]}" >> $GITHUB_OUTPUT

    - id: verify-vcs-digest
      name: Verify VCS release asset digest
      shell: bash
      run: |
        echo "Fetching release information from: ${{ inputs.access-vcs-url }}"
        TMP_RELEASE=$(mktemp)
        AUTH_ARGS=()
        if [[ -n "${GH_TOKEN:-}" ]]; then
          AUTH_ARGS=(-H "Authorization: Bearer ${GH_TOKEN}")
        fi
        HTTP_CODE=$(curl -sS --retry 3 --retry-all-errors -o "$TMP_RELEASE" -w '%{http_code}' \
          -H "Accept: application/vnd.github+json" \
          -H "User-Agent: vba-build" \
          "${AUTH_ARGS[@]}" \
          "${{ inputs.access-vcs-url }}" || true)
        echo "HTTP status: $HTTP_CODE"
        if [[ "$HTTP_CODE" != "200" ]] || ! jq -e . "$TMP_RELEASE" >/dev/null 2>&1; then
          echo "Error: Failed to retrieve valid JSON from ${{ inputs.access-vcs-url }} (HTTP ${HTTP_CODE:-000})."
          echo "Response preview:"
          head -c 2000 "$TMP_RELEASE" 2>/dev/null || true
          rm -f "$TMP_RELEASE"
          exit 1
        fi
        RELEASE_DATA=$(cat "$TMP_RELEASE")
        rm -f "$TMP_RELEASE"
        ACTUAL_SHA=$(echo "$RELEASE_DATA" | jq -r '.assets[0].digest // empty' | sed 's/sha256://')

        if [[ -z "$ACTUAL_SHA" ]]; then
          echo "SHA256 digest not available from API. Downloading asset to compute it locally..."
          DOWNLOAD_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[0].browser_download_url // empty')
          if [[ -z "$DOWNLOAD_URL" ]]; then
            echo "Error: Could not find download URL for release asset."
            exit 1
          fi
          echo "Downloading: $DOWNLOAD_URL"
          TMP_ZIP=$(mktemp)
          curl -fsSL -o "$TMP_ZIP" "$DOWNLOAD_URL"
          ACTUAL_SHA=$(sha256sum "$TMP_ZIP" | cut -d' ' -f1)
          rm -f "$TMP_ZIP"
          echo "Computed SHA256: $ACTUAL_SHA"
        fi
        
        if [[ -n "${{ inputs.access-vcs-sha }}" ]]; then
          echo "Expected SHA256: ${{ inputs.access-vcs-sha }}"
          echo "Actual SHA256: $ACTUAL_SHA"
          
          if [[ "${{ inputs.access-vcs-sha }}" != "$ACTUAL_SHA" ]]; then
            echo "Error: SHA256 digest mismatch!"
            echo "Expected: ${{ inputs.access-vcs-sha }}"
            echo "Actual: $ACTUAL_SHA"
            exit 1
          fi
          
          echo "SHA256 digest verification passed!"
        else
          echo "No expected SHA256 provided, skipping verification."
          echo "Current release SHA256: $ACTUAL_SHA"
        fi

    - name: Call action 0
      if: ${{ fromJSON(steps.parse.outputs.count) > 0 }}
      uses: DecimalTurn/msaccess-vcs-build@685b323ffcf506c8b989ece2863e509bbf3775fa # v1.1.0-rate-limiting
      with:
        source-dir: ${{ steps.parse.outputs.value0 }}
        target-dir: ${{ inputs.target-dir }}
        compile: ${{ steps.parse.outputs.compile0 }}
        app-config: ${{ inputs.access-vcs-config }}
        vcs-url: ${{ inputs.access-vcs-url }}

    - name: Call action 1
      if: ${{ fromJSON(steps.parse.outputs.count) > 1 }}
      uses: DecimalTurn/msaccess-vcs-build@685b323ffcf506c8b989ece2863e509bbf3775fa # v1.1.0-rate-limiting
      with:
        source-dir: ${{ steps.parse.outputs.value1 }}
        target-dir: ${{ inputs.target-dir }}
        compile: ${{ steps.parse.outputs.compile1 }}
        app-config: ${{ inputs.access-vcs-config }}
        vcs-url: ${{ inputs.access-vcs-url }}

    - name: Call action 2
      if: ${{ fromJSON(steps.parse.outputs.count) > 2 }}
      uses: DecimalTurn/msaccess-vcs-build@685b323ffcf506c8b989ece2863e509bbf3775fa # v1.1.0-rate-limiting
      with:
        source-dir: ${{ steps.parse.outputs.value2 }}
        target-dir: ${{ inputs.target-dir }}
        compile: ${{ steps.parse.outputs.compile2 }}
        app-config: ${{ inputs.access-vcs-config }}
        vcs-url: ${{ inputs.access-vcs-url }}

    - name: Call action 3
      if: ${{ fromJSON(steps.parse.outputs.count) > 3 }}
      uses: DecimalTurn/msaccess-vcs-build@685b323ffcf506c8b989ece2863e509bbf3775fa # v1.1.0-rate-limiting
      with:
        source-dir: ${{ steps.parse.outputs.value3 }}
        target-dir: ${{ inputs.target-dir }}
        compile: ${{ steps.parse.outputs.compile3 }}
        app-config: ${{ inputs.access-vcs-config }}
        vcs-url: ${{ inputs.access-vcs-url }}

    - name: Call action 4
      if: ${{ fromJSON(steps.parse.outputs.count) > 4 }}
      uses: DecimalTurn/msaccess-vcs-build@685b323ffcf506c8b989ece2863e509bbf3775fa # v1.1.0-rate-limiting
      with:
        source-dir: ${{ steps.parse.outputs.value4 }}
        target-dir: ${{ inputs.target-dir }}
        compile: ${{ steps.parse.outputs.compile4 }}
        app-config: ${{ inputs.access-vcs-config }}
        vcs-url: ${{ inputs.access-vcs-url }}