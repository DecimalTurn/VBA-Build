name: "VBA Build"
description: "Build VBA-Enabled Office documents from source code using GitHub Actions."

branding:
  icon: 'code'
  color: 'blue' 

inputs:
  source-dir:
    description: 'Relative path to the directory containing the source folders'
    required: false
    default: 'src'
  test-framework:
    description: 'The test framework to use for the build process.'
    required: false
    default: 'none'
  office-app:
    description: |
      The Office application to install.
      The default mode is automatic and will detect the app based on the folder name.
      To force a specific app instead, use the options: Excel, Word, PowerPoint or Access.
    required: false
    default: 'automatic'
  access-vcs-config:
    description: |
      Application config file passed to msaccess-vcs-build for Access builds
      (set database properties, run procedures, remove modules/references, etc.).
      Empty = no prepare step.
    required: false
    default: ''
  access-vcs-url:
    description: 'msaccess-vcs-addin release URL used to build/compile Access databases'
    required: false
    default: 'https://api.github.com/repos/joyfullservice/msaccess-vcs-addin/releases/tags/v5.0.1'
  access-vcs-sha:
    description: 'Expected SHA256 digest of the vcs-addin asset (optional; empty = skip verification)'
    required: false
    default: '9504af3dfaea2c8f072fdde8bbcd5ee2b8f03f656828348370f4f0129e642249'
  access-vcs-compile:
    description: 'Force compiling all Access builds to ACCDE. Empty = compile only source folders named *.accde'
    required: false
    default: ''
  github-token:
    description: 'GitHub token used to authenticate GitHub API requests. Defaults to the automatic GITHUB_TOKEN of the workflow.'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: "Install 7-zip"
      shell: pwsh
      run: choco install 7zip.install
    - name: "Expose GitHub token to environment"
      shell: bash
      env:
        TOKEN: ${{ inputs['github-token'] || github.token }}
      run: |
        if [ -n "$TOKEN" ]; then
          echo "GH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "GITHUB_TOKEN=$TOKEN" >> "$GITHUB_ENV"
        fi
    - name: "Run VBA Build"
      id: "run_vba_build"
      shell: pwsh
      run: |
        ${{ github.action_path }}\Main.ps1 `
          -SourceDir        "${{ inputs['source-dir'] }}" `
          -TestFramework    "${{ inputs['test-framework'] }}" `
          -OfficeAppDetection "${{ inputs['office-app'] }}" `
          -AccessVcsUrl     "${{ inputs['access-vcs-url'] }}" `
          -AccessVcsSha     "${{ inputs['access-vcs-sha'] }}" `
          -AccessVcsConfig  "${{ inputs['access-vcs-config'] }}" `
          -AccessVcsCompile "${{ inputs['access-vcs-compile'] }}"
outputs:
  processed-folders:
    description: "Number of folders processed during the build"
    value: ${{ steps.run_vba_build.outputs.processed-folders }}
  successful-builds:
    description: "Number of successful builds completed"
    value: ${{ steps.run_vba_build.outputs.successful-builds }}
  office-apps:
    description: "Comma-separated list of Office applications used"
    value: ${{ steps.run_vba_build.outputs.office-apps }}
  access-folders:
    description: "Comma-separated list of Access database source folders"
    value: ${{ steps.run_vba_build.outputs.access-folders }}
  has-access-database:
    description: "Boolean indicating if any Access database folders were found"
    value: ${{ steps.run_vba_build.outputs.has-access-database }}
